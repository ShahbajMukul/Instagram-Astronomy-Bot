name: Daily Instagram APOD

on:
  schedule:
    - cron: "0 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-instagram-apod
  cancel-in-progress: false

jobs:
  post-apod:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Instagram Astronomy Bot
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SYSTEM_PROMPT: ${{ secrets.GEMINI_SYSTEM_PROMPT }}
          INSTAGRAM_ID: ${{ secrets.INSTAGRAM_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CARTESIA_KEY: ${{ secrets.CARTESIA_KEY }}
          CARTESIA_MODEL: ${{ secrets.CARTESIA_MODEL }}
          MUSIC_DIR: music
          MUSIC_VOLUME: "0.12"
        run: python main.py

      - name: Save posting history
        if: always()
        run: |
          if [ -f posted_dates.txt ]; then
            branch_name="${GITHUB_REF_NAME:-main}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git pull --rebase origin "$branch_name"

            git add posted_dates.txt

            if ! git diff --cached --quiet; then
              git commit -m "Record APOD post"

              for attempt in 1 2 3; do
                if git push origin "HEAD:$branch_name"; then
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  echo "Failed to push posted_dates.txt after retries."
                  exit 1
                fi
                git pull --rebase origin "$branch_name"
              done
            fi
          fi