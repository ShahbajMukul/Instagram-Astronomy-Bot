name: Daily APOD Post

on:
  schedule:
    - cron: '0 12 * * *' # Runs every day at 12:00 PM UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  post-apod:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Astronomy Bot
      env:
        NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        INSTAGRAM_ID: ${{ secrets.INSTAGRAM_ID }}
        INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python main.py
        
    - name: Commit posted dates
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        touch posted_dates.txt
        git add posted_dates.txt
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update posted dates" && git push)
